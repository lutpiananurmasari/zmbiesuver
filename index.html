<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zombie Survival 2 Player</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div id="hud">

<div>
⏰ Waktu :
<span id="time">120</span>
</div>

<div>
⭐ Level :
<span id="level">1</span>
</div>

<div>
🏆 Skor :
<span id="score">0</span>
</div>

<div>
❤️ Nyawa :
<span id="health">100</span>
</div>

</div>

<div id="game">

<div id="player1" class="player player1"></div>

<div id="player2" class="player player2"></div>

</div>

<div id="gameOver" class="hidden">

<h1>GAME OVER</h1>

<h2 id="finalScore"></h2>

<button onclick="location.reload()">
Main Lagi
</button>

</div>

<audio id="shootSound" src="assets/shoot.wav"></audio>
<audio id="hitSound" src="assets/hit.wav"></audio>
<audio id="levelSound" src="assets/levelup.wav"></audio>
<audio id="gameOverSound" src="assets/gameover.wav"></audio>

<script src="script.js"></script>

</body>
</html>
